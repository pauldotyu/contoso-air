apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-air
  namespace: team-blue
  labels:
    app.kubernetes.io/name: contoso-air
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-air
  template:
    metadata:
      labels:
        app: contoso-air
        app.kubernetes.io/name: contoso-air
        app.kubernetes.io/managed-by: containerization-assist
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: contoso-air-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contoso-air
          image: acrdevxdemoljdo.azurecr.io/contoso-air:08aa4ed1d087
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: contoso-air-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}